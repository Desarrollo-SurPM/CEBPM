{% extends 'guardian/base_guardian.html' %}
{% block title %}Nueva Consulta{% endblock %}
{% block page_title %}Nueva Consulta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        
        <a href="{% url 'tickets:list' %}" class="btn btn-link text-muted text-decoration-none ps-0 mb-3">
            <i class="bi bi-arrow-left me-1"></i> Volver al historial
        </a>

        <div class="card-modern p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-chat-text-fill fs-3"></i>
                </div>
                <h4 class="fw-bold">Escribe tu consulta</h4>
                <p class="text-muted small">El equipo administrativo te responderá a la brevedad posible.</p>
            </div>

            <form method="POST" class="needs-validation">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted text-uppercase">Asunto</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-tag"></i></span>
                        <input type="text" name="subject" class="form-control border-start-0 rounded-end-3 py-2 shadow-sm" 
                               placeholder="Ej: Error en el monto de la cuota..." required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted text-uppercase">Mensaje</label>
                    <textarea name="message" class="form-control rounded-3 shadow-sm p-3" rows="6" 
                              placeholder="Describe tu situación detalladamente..." required></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary rounded-pill py-3 fw-bold shadow-sm">
                        <i class="bi bi-send-fill me-2"></i> Enviar Consulta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
